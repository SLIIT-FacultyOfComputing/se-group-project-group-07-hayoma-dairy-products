name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'Frontend/package-lock.json'
    
    - name: Install dependencies
      run: cd Frontend && npm ci --legacy-peer-deps
    
    - name: Run ESLint
      run: cd Frontend && npm run lint --if-present
      continue-on-error: true
    
    - name: Run Cypress E2E tests
      uses: cypress-io/github-action@v6
      with:
        working-directory: Frontend
        start: npm run dev
        wait-on: http://localhost:3000
        wait-on-timeout: 120
        record: false
        spec: cypress/e2e/**/*.cy.ts
      env:
        NEXTAUTH_URL: http://localhost:3000
        NEXTAUTH_SECRET: test-secret-key-for-ci
    
    - name: Generate Mochawesome report
      if: always()
      run: cd Frontend && npm run test:reports
      continue-on-error: true
    
    - name: Upload Cypress videos
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-videos
        path: Frontend/cypress/videos/
        retention-days: 7
    
    - name: Upload Cypress screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-screenshots
        path: Frontend/cypress/screenshots/
        retention-days: 7
    
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: Frontend/cypress/reports/
        retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: 'Frontend/package-lock.json'
    
    - name: Install dependencies
      run: cd Frontend && npm ci --legacy-peer-deps
    
    - name: Build Next.js app
      run: cd Frontend && npm run build
      env:
        NEXTAUTH_URL: https://${{ github.event.repository.owner.login }}.github.io/${{ github.event.repository.name }}
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
    
    - name: Upload artifact to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: Frontend/.next/static
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  notify:
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: always()
    
    steps:
    - name: Test Summary
      run: |
        echo "### Frontend CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Tests completed - Check artifacts for reports and videos" >> $GITHUB_STEP_SUMMARY
